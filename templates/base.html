<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CareerForge{% endblock %}</title>
  <meta name="description" content="AI-powered career roadmap and skill-gap planner.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">C</span><span>CareerForge</span></a>
  <nav>
    <a href="/">Home</a>
    <a href="/assessment">Assessment</a>
    <a href="/resources">Resources</a>
    <a href="/about">About</a>
  </nav>
  <a class="nav-cta" href="/assessment">Build my roadmap <span>→</span></a>
</header>

<main>{% block content %}{% endblock %}</main>

<footer class="footer">
  <div><strong>CareerForge</strong><br><span>Turn your current skills into your next direction.</span></div>
  <div class="footer-note">AI-generated guidance • Verify course details before enrolling</div>
</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
